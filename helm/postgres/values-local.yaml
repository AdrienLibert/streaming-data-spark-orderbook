auth:
  database: analytics
  password: postgres # default user: postgres

primary:
  initdb:
    scripts:
      init.sql: |
        CREATE TABLE IF NOT EXISTS candlesticks (
            timestamp TIMESTAMP,
            open DOUBLE PRECISION,
            close DOUBLE PRECISION,
            high DOUBLE PRECISION,
            low DOUBLE PRECISION,
            volume INTEGER,
            PRIMARY KEY (timestamp)
        );